<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#F7F4F0">
<meta name="description" content="帧叙集 — 把一堆零散照片，整理成你的生活故事">
<title>帧叙集</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<!-- iOS 不认 SVG，apple-touch-icon 必须给 PNG，否则主屏图标是截图/白板 -->
<link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
<script>window.APP_VERSION = '0.6.6';</script>

<header class="topbar" id="topbar">
  <div class="brand">
    <!-- Logo：翻开的册页 + 柔和时间轴 + 帧点（纤细圆角单线，无直角无粗线）
         与 icons/logo-mini.svg 同源 —— 改这个图形**两边必须一起改**（自测 L5 逐条比对 path 的 d）。
         ⚠️ 0.6.3 起它与**桌面图标不再同源**，这是有意分叉而非漏改：
            桌面图标已换成康哥定稿的「帧」字标，而页头只有 24px ——
            11 画的汉字缩到这个尺寸会糊成一团，单线册页在这里可读性明显更好。
         ⚠️ 这里保持内联 SVG（不是 <img>）：.brand__mark 靠 color 继承 currentColor，
            且自测会取 .brand__mark svg path 的 stroke 校验品牌色。 -->
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
           stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6.2C10.5 5.1 8.8 4.6 7.2 4.6H6A2 2 0 0 0 4 6.6v10.8a2 2 0 0 0 2 2h1.2c1.6 0 3.3-.5 4.8-1.6"/>
        <path d="M12 6.2c1.5-1.1 3.2-1.6 4.8-1.6H18a2 2 0 0 1 2 2v10.8a2 2 0 0 1-2 2h-1.2c-1.6 0-3.3-.5-4.8-1.6"/>
        <path d="M4.5 13Q8.25 9.5 12 13q3.75 3.5 7.5 0" stroke-width="0.92" opacity=".9"/>
        <circle cx="8.25" cy="11.25" r="1.3" fill="currentColor" stroke="none" opacity=".5"/>
        <circle cx="15.75" cy="14.75" r="1.3" fill="currentColor" stroke="none" opacity=".9"/>
      </svg>
    </span>
    <span class="brand__name">帧叙集</span>
  </div>
  <!-- Slogan 必须完整展示（V1.3：禁止省略号截断）；窄屏由 CSS 整条换到第二行 -->
  <span class="brand__slogan">把一堆零散照片，整理成你的朋友圈生活故事</span>
  <button class="help" data-act="help" aria-label="帮助">帮助</button>
</header>

<main class="view" id="view" role="main"></main>

<!-- 更新弹窗浮层的挂载点：**故意放在 <main> 外面**（body 级）。
     ① 语义：对话框不属于「主内容」，塞进 <main> 等于告诉读屏软件它是正文的一部分。
     ② 更要紧的是层叠：P0-3 给 .view 加了主题化进场动效，动画期间 .view 上有非 none 的
        transform —— 而 transform 会替 position:fixed 的后代**造出包含块**，弹窗会被锚到
        .view 而非视口；强制更新弹窗常常在启动动画还没跑完时就弹出来，那几百毫秒里遮罩
        只盖住 main 这一块、露着顶栏和底栏（真跑测得）。挪到 body 级，根因消失。
     ③ 附带好处：将来给 .view 加 filter / contain / will-change 也不会再踩同一个坑。
     事件委托绑在 document 上（js/app.js），所以挪出去按钮照常可点。 -->
<div id="modalRoot"></div>

<nav class="tabbar" id="tabbar" role="tablist">
  <button class="tab" data-tab="create" data-act="goTab" role="tab">
    <svg class="tab__i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
    <span class="tab__t">新建</span>
  </button>
  <button class="tab" data-tab="gallery" data-act="goTab" role="tab">
    <svg class="tab__i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M4 15.5l3.4-3.2a2 2 0 0 1 2.7 0L15 16.5"/><circle cx="15.6" cy="9.6" r="1.1"/></svg>
    <span class="tab__t">作品集</span>
  </button>
  <button class="tab" data-tab="recipes" data-act="goTab" role="tab">
    <svg class="tab__i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5v15M4.5 12h15"/></svg>
    <span class="tab__t">素材配方</span>
  </button>
  <button class="tab" data-tab="settings" data-act="goTab" role="tab">
    <svg class="tab__i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 4.5v2M12 17.5v2M4.5 12h2M17.5 12h2M6.7 6.7l1.4 1.4M15.9 15.9l1.4 1.4M17.3 6.7l-1.4 1.4M8.1 15.9l-1.4 1.4"/></svg>
    <span class="tab__t">设置</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 🔴 synapse 桩：@capacitor/filesystem 的 dist/plugin.js（8.1.4）在 IIFE 入口把
     一个未定义的全局 `synapse` 当参数传入并调用 `synapse.exposeSynapse()`，
     若不先建出该全局，整个脚本会在参数求值处抛 ReferenceError，导致
     Filesystem 永远注册不上 → 应用内更新 installApkInApp 拿不到 Filesystem 而失败。
     core 8.5.2 并不提供 synapse，故这里用一个无副作用的桩补上（exposeSynapse 仅用于
     暴露 web 实现，原生调用走 bridge，与桩无关，安全）。必须在 vendor 脚本之前。 -->
<script>window.synapse = { exposeSynapse() {} };</script>

<!-- 🔴 Capacitor 运行时 + 原生安装插件：必须以经典脚本顺序加载（先于 app.js 模块）。
     应用内 APK 更新依赖 Capacitor.Plugins.AppInstallPlugin / Filesystem，
     这俩全局由 capacitor.js + 插件 dist/plugin.js 自注册建出。漏加载 → 更新误判非原生 → window.open 跳出应用。
     顺序：capacitor.js（建全局）→ filesystem（注册 Filesystem）→ app-install（注册 AppInstallPlugin）→ app.js(module) -->
<script src="/vendor/capacitor.js"></script>
<script src="/vendor/filesystem-plugin.js"></script>
<script src="/vendor/app-install-plugin.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
