name: Build 帧叙集 APK

# 触发：push tag v*（发版）或手动（release 默认；debug 签名随机，不可覆盖安装）
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      buildType:
        description: 'release (fixed keystore) or debug (random signature)'
        required: true
        default: 'release'
        type: choice
        options: [release, debug]

permissions:
  contents: write

env:
  BUILD_TYPE: ${{ github.event.inputs.buildType || 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Capacitor CLI 8.x requires Node >= 22
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # 🔴 测试矩阵前置闸门（文档 P0：自动化测试不过不放行构建）。
      #    放在构建之前 —— 任何逻辑/契约/环境兼容缺陷都应在「还没开始打包」时
      #    被拦下，而不是等 1 分多钟构建完才发现。CI 无模型 key，verify-llm
      #    只跑纯逻辑段（网络段自动跳过并标注），这恰好是可在 CI 跑的部分。

      # LLM 路由：三层断言 + A/B 鉴别力（逻辑段，无需真 key）
      - name: Test · LLM 路由 (verify-llm.js)
        run: node worker/verify-llm.js

      # Worker 运行环境兼容：裸 process 访问静态扫描（不兼容会线上 500）
      - name: Test · Worker 环境兼容 (check-worker-env)
        run: node scripts/check-worker-env.mjs

      # Android 构建配置漂移：CI 与本地必须同构（方案 A 的前提）
      - name: Test · Android 配置一致性 (check-android-config)
        run: node scripts/check-android-config.mjs

      # 主题生成 & 对比度闸门（防"改主题配置却没重新生成 CSS"）
      - name: Test · 主题生成与对比度
        run: npm run check:theme

      - name: Build web assets into www/
        run: npm run build:web

      # 🔴 2026-10-03 决策（方案 A）：android/ 已入库，CI **不再重建工程**，只同步 web 产物。
      #
      # 历史：这里原先是 `rm -rf android && capacitor add android`，
      #   每次生成一份**全新的 stock 工程**，而 android/ 整体在 .gitignore 里。
      #   后果：本地这份定制过的构建配置（签名配置 / v3 签名 / R8 排除 WebView JS 桥接 /
      #   keystore 路径校验 / 中文路径 overridePathCheck）**CI 完全用不到** ——
      #   CI 产出的包与本地根本不是同一套构建，且 stock 工程里没有读 keystore 的逻辑，
      #   签名必然失败（v0.6.0/0.6.1/0.6.2 三代 CI 全红的深层原因之一）。
      #
      # 现在：`cap copy` 只做一件事 —— 把 www/ 同步进 android/app/src/main/assets/public/，
      #   不触碰任何构建脚本。于是 **CI 与本地跑的是同一套 build.gradle**，
      #   「本地能出包、CI 出不了」这类分歧从结构上消失。
      #   注：assets/ 在 .gitignore 里（它是产物副本），所以这一步每次都必须跑。
      - name: Sync web assets into committed android project
        run: |
          rm -rf android/app/src/main/assets/public
          # 🔴 注意：cap copy 失败时**退出码仍然是 0**（2026-10-03 实测：www/ 缺失时
          #    它打印 "× copy android - failed!" 却 exit 0）。所以 `|| ...` 兜不住错误，
          #    不能把它的退出码当闸门。下面两条 test 断言才是唯一的硬校验。
          set +e
          node ./node_modules/@capacitor/cli/bin/capacitor copy android > cap_copy.log 2>&1
          CAP_RC=$?
          set -e
          cat cap_copy.log
          test -f android/app/build.gradle || {
            echo "::error::android/app/build.gradle 缺失 —— 入库的工程不完整"
            exit 1
          }
          test -f android/app/src/main/assets/public/index.html || {
            echo "::error::cap copy 退出码=$CAP_RC 但产物未同步进 assets/public，APK 里会是空壳"
            echo "::error::log-tail:$(tail -c 350 cap_copy.log 2>/dev/null | tr '\n' '~')"
            exit 1
          }
          # 🔴 关键自检：CI 用的 build.gradle 必须就是仓库里那份（含签名逻辑），
          #    而不是 cap 重新生成的 stock 版本。缺了这段校验，
          #    「哪天有人改回 cap add」会静默退化成两套构建配置。
          grep -q "keystoreProps" android/app/build.gradle || {
            echo "::error::build.gradle 里没有 keystoreProps —— 这不是仓库里那份定制配置"
            exit 1
          }
          echo "工程与 web 产物均已就位"
          grep -E "versionCode|versionName" android/app/build.gradle

      # 🔴 帧叙集核心：相册权限。方案的「部分照片 / 完整相册两级权限」在 Android 上
      #    对应两级真实 API，漏任一权限都会让相册扫描直接空返回：
      #      • READ_MEDIA_IMAGES            —— Android 13(API33)+ 完整读图
      #      • READ_MEDIA_VISUAL_USER_SELECTED —— Android 14(API34)+ **部分照片访问**（用户勾选）
      #      • READ_EXTERNAL_STORAGE        —— API ≤32 旧模型（必须带 maxSdkVersion，否则
      #                                        Android 13+ 上被系统直接忽略并可能触发商店审核问题）
      #    注：MVP 只处理图片，不申请 READ_MEDIA_VIDEO（视频直接跳过）。
      #
      # 🔴 2026-10-03 起从「注入」改为「校验」：
      #    android/ 入库后，AndroidManifest.xml 就是**权威源**，权限已在仓库里。
      #    继续用 sed 注入只会制造"两处都在改同一件事"的假象 ——
      #    将来有人改了入库的 Manifest，CI 这边可能又把它 sed 回去，且都不报错。
      #    改为断言校验：缺任一权限直接失败，把"权限丢了"挡在出包前。
      - name: Verify photo library permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          MISSING=""
          for P in READ_MEDIA_IMAGES READ_MEDIA_VISUAL_USER_SELECTED ACCESS_NETWORK_STATE INTERNET; do
            grep -q "android.permission.$P" "$M" || MISSING="$MISSING $P"
          done
          # READ_EXTERNAL_STORAGE 必须带 maxSdkVersion，否则 Android 13+ 上被系统忽略
          grep -qE 'READ_EXTERNAL_STORAGE[^>]*maxSdkVersion' "$M" \
            || MISSING="$MISSING READ_EXTERNAL_STORAGE(缺maxSdkVersion)"
          if [ -n "$MISSING" ]; then
            echo "::error title=permission-missing::AndroidManifest 缺少权限：$MISSING"
            echo "::error::相册扫描会直接空返回（帧叙集核心功能失效），已中止出包"
            exit 1
          fi
          echo "相册权限齐全："
          grep -o 'android.permission.[A-Z_]*' "$M" | sort -u

      - name: Resolve version from index.html (single source of truth)
        id: ver
        run: |
          V=$(node -e "const h=require('fs').readFileSync('index.html','utf8');const m=h.match(/window\.APP_VERSION = '([\d.]+)'/);process.stdout.write(m[1])")
          IFS='.' read -r MA MI PA <<< "$V"
          CODE=$((MA*10000 + MI*100 + PA))
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "versionName/versionCode = $V / $CODE"

      - name: Stamp versionName & versionCode
        run: |
          BG=android/app/build.gradle
          # 🔴 用「广义匹配」而不是原来的 `s/versionCode 1/...` ：
          #    android/ 入库后，CI 拿到的**就是仓库里那份** build.gradle，
          #    其中已经写着 `versionCode 602` / `versionName "0.6.2"`，
          #    旧模式 `versionCode 1` 会一条都匹配不到 → sed 静默不生效 →
          #    CI 出的包版本号仍是仓库里那个值。如果恰好没改，看着"正常"；
          #    一旦 index.html 已升版而 build.gradle 没升，就会出**版本号错位的包**，
          #    而且没有任何报错。这类"静默不生效"必须用结果校验兜住。
          sed -i -E "s/^([[:space:]]*)versionCode[[:space:]]+[0-9]+/\1versionCode ${{ steps.ver.outputs.code }}/" "$BG"
          sed -i -E "s/^([[:space:]]*)versionName[[:space:]]+\"[^\"]*\"/\1versionName \"${{ steps.ver.outputs.version }}\"/" "$BG"
          grep -E "versionCode|versionName" "$BG"

          # 结果校验：stamp 必须真的生效，且与 index.html 解析出的值一致
          #
          # 🔴 必须**先剥掉注释行再解析**。否则会假绿：
          #    build.gradle 里满是提到 versionCode / versionName 的注释，
          #    `grep -oE 'versionCode[[:space:]]+[0-9]+'` 会连注释一起匹配。
          #    实测反证：把真行注释掉、并把注释里的数字改成与期望值相同时，
          #    解析结果照样等于期望值 → 闸门静默失效（真实版本号已丢失却判通过）。
          #    这类"仪器读到了注释而非事实"的假绿，是本项目反复踩到的同一类坑。
          NONCOMMENT=$(grep -vE '^[[:space:]]*(//|/\*|\*)' "$BG")
          GOT_CODE=$(printf '%s\n' "$NONCOMMENT" | grep -oE 'versionCode[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | head -1)
          GOT_NAME=$(printf '%s\n' "$NONCOMMENT" | grep -oE 'versionName[[:space:]]+"[^"]*"' | grep -oE '"[^"]*"' | tr -d '"' | head -1)
          WANT_CODE="${{ steps.ver.outputs.code }}"
          WANT_NAME="${{ steps.ver.outputs.version }}"
          # 非空前置保护：解析不到值时 GOT_CODE 为空，必须显式判失败，
          # 不能依赖"空字符串 != 期望值"这种巧合来拦住。
          if [ -z "$GOT_CODE" ] || [ -z "$GOT_NAME" ]; then
            echo "::error title=version-stamp-not-found::在 build.gradle 的非注释行里找不到 versionCode/versionName"
            echo "::error::解析到 versionCode='${GOT_CODE}' versionName='${GOT_NAME}'"
            exit 1
          fi
          if [ "$GOT_CODE" != "$WANT_CODE" ] || [ "$GOT_NAME" != "$WANT_NAME" ]; then
            echo "::error title=version-stamp-mismatch::build.gradle 版本号未被正确写入"
            echo "::error::期望 ${WANT_NAME}/${WANT_CODE}，实际 ${GOT_NAME}/${GOT_CODE}"
            exit 1
          fi
          echo "版本号已对齐：${GOT_NAME} / ${GOT_CODE}"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant gradlew
        run: chmod +x android/gradlew

      # 🔴 local.properties 不入库（每个机器 SDK 路径不同），所以 CI 上必须靠
      #    runner 自带的 ANDROID_HOME / ANDROID_SDK_ROOT。这里显式校验一次：
      #    runner 镜像变动导致 SDK 缺失时，能给出"缺 SDK"这句人话，
      #    而不是让 gradle 抛一堆找不到 android.jar 的晦涩异常。
      - name: Verify Android SDK is available
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error title=no-android-sdk::runner 未提供 Android SDK（ANDROID_HOME/ANDROID_SDK_ROOT 均空）"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK"
          ls "$SDK" | head -10
          # build-tools 与 platforms 必须存在，否则 compileSdk 解析会失败
          test -d "$SDK/build-tools"  || { echo "::error::缺 $SDK/build-tools"; exit 1; }
          test -d "$SDK/platforms"    || { echo "::error::缺 $SDK/platforms"; exit 1; }

      # 🔴 固定 keystore：签名不一致 = 无法覆盖安装 = WebView 里的本地数据全丢。
      #
      # 这一步必须在 **Build APK 之前**跑完，原因：
      #   app/build.gradle 在 **配置阶段**就要读 android/keystore.properties，
      #   文件不在 → release 构建直接报错退出。原先放在 build 之后，
      #   逻辑上永远来不及（它只能在 APK 已经产出后才执行）。
      #
      # 历史事故（v0.6.0 / v0.6.1 / v0.6.2 连续三代 CI 全红，本地出包却全绿）：
      #   原实现是「构建后若无 keystore 就现场 genkeypair，然后 git add 它」。
      #   两个致命问题：
      #     ① `git add android/zhenxuji-release.keystore` 必然失败并 exit 1 ——
      #        android/ 在 .gitignore 里。它**不是** line 末尾 `|| echo` 能兜住的
      #        "nothing to commit" 情形，于是 bash -e 直接把整个 job 打死。
      #     ② 更根本：CI 现场生成的是一把**全新的随机密钥**，
      #        它永远不可能等于本地那把真签名密钥 → CI 产出的 APK
      #        与历史版本签名不同 → 老用户覆盖安装必然失败。
      #        「固化 keystore」这个意图，靠"每次现场生成再 commit"是实现不了的。
      #
      # 正解：密钥作为 GitHub Secret 传入（base64 编码的 jks + 口令），
      #       CI 只负责解码写盘、不负责生成。口令永不进仓库。
      #   所需 Secret：KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      - name: Restore fixed keystore (before build)
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error title=missing-keystore::未配置 KEYSTORE_B64 secret。"
            echo "::error::release 构建必须用固定密钥签名，否则 CI 包无法覆盖安装历史版本。"
            echo "::error::请在仓库 Settings → Secrets and variables → Actions 配置："
            echo "::error::  KEYSTORE_B64        = base64 -w0 zhenxuji-release.jks"
            echo "::error::  KEYSTORE_PASSWORD   = <storePassword>"
            echo "::error::  KEY_ALIAS           = <alias>"
            echo "::error::  KEY_PASSWORD        = <keyPassword>"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/zhenxuji-release.keystore
          # 只写相对 android/ 的路径：build.gradle 用 rootProject.file() 解析，
          # 绝对路径会在 runner 上指向 /home/runner/... 而失效。
          cat > android/keystore.properties <<EOF
          storeFile=zhenxuji-release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          # 自检：签名配置真的可读、密钥文件真的解出来了（避免又出现"构建成功但没签名"）
          test -s android/zhenxuji-release.keystore || { echo "::error::keystore 解码为空"; exit 1; }
          keytool -list -keystore android/zhenxuji-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::keystore 口令或 alias 不匹配（检查 KEYSTORE_PASSWORD / KEY_ALIAS）"; exit 1; }
          echo "keystore 就位，alias=${KEY_ALIAS}"
          # 🔴 不能打印指纹以外的内容；只输出证书指纹供跨版本比对
          keytool -list -v -keystore android/zhenxuji-release.keystore \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -E "SHA256:" | head -1 || true

      # 体积闸门：cap sync 不读 .gitignore，混入归档/依赖会把 APK 撑到几十 MB
      - name: Size gate (web assets <= 20MB)
        run: |
          SIZE_MB=$(du -sm android/app/src/main/assets/public | cut -f1)
          echo "web assets: ${SIZE_MB}MB"
          BAD=$(find android/app/src/main/assets/public -type f \( -name '*.apk' -o -name '*.zip' \) -print)
          if [ -n "$BAD" ]; then echo "::error::发现归档文件被打包：$BAD"; exit 1; fi
          if [ "$SIZE_MB" -gt 20 ]; then echo "::error::web 资产 ${SIZE_MB}MB 超限"; exit 1; fi

      - name: Build APK
        run: |
          cd android
          set +e
          ./gradlew assemble${{ env.BUILD_TYPE == 'debug' && 'Debug' || 'Release' }} --no-daemon 2>&1 | tee /tmp/gradle.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            ERR=$(grep -nE "error:|cannot find symbol|Execution failed|What went wrong|FAILED|NewApi|requires API level" /tmp/gradle.log | head -25 | tr '\n' '~')
            echo "::error title=gradle-build-failed::${ERR}"
            echo "::error title=gradle-tail::$(tail -45 /tmp/gradle.log | tr '\n' '~')"
          fi
          exit "$RC"

      # 🔴 这里原先有一个「Sign release with fixed keystore」步骤（构建后若发现没有
      #    keystore 就现场 genkeypair，再 `git add` + `git commit` 把它固化进仓库）。
      #    v0.6.0 / v0.6.1 / v0.6.2 三代 CI 全红就是它，两个问题叠在一起：
      #      ① `git add android/zhenxuji-release.keystore` 必然 exit 1 ——
      #         android/ 在 .gitignore 里（既定设计：CI 每次重新生成 android 项目）。
      #         它**不是**行尾 `|| echo` 能兜住的"nothing to commit"情形，
      #         于是 `bash -e` 直接把整个 job 打死。
      #      ② 更根本：该步骤排在 Build APK 之后，而 app/build.gradle 在**配置阶段**
      #         就要读 android/keystore.properties。时机上永远来不及。
      #         且现场 genkeypair 出的是**全新随机密钥**，不可能等于真签名密钥
      #         → CI 包与历史版本签名不同 → 老用户覆盖安装必然失败。
      #    已删除，签名改为**构建前**从 secret 恢复（见上方 "Restore fixed keystore"）。
      #    教训：**"把产物 commit 回仓库"这类自修改 CI，必须先把该路径跟 .gitignore 对一遍；
      #         且凡是构建要读的配置，其准备步骤必须排在构建之前。**

      - name: Rename & expose artifact
        run: |
          T=${BUILD_TYPE}
          if [ "$T" = "debug" ]; then SRC=android/app/build/outputs/apk/debug/app-debug.apk; else SRC=android/app/build/outputs/apk/release/app-release.apk; fi
          mkdir -p dist
          # 🔴 文件名一律用 ASCII。实测（v0.6.0 与 v0.6.3 两代）：
          #    非 ASCII 文件名（帧叙集-…）在 CI 工具链里会被吞掉中文，
          #    变成 "-v0.6.x-release.apk"（开头一个连字符），既难看又难引用；
          #    本机 Windows 实测同样会 mojibake（显示为 "?-v0.6.3-release.apk"）。
          #    中文品牌名交给 Release 标题 / 页面展示，文件名保持 ASCII 稳定。
          #    注意 v0.6.1 / v0.6.2 恰好没中招，属于运气（见 v0.6.0 同名问题），
          #    不能依赖 —— 故此处按「永远 ASCII」处理，而非复现旧名。
          cp "$SRC" "dist/zhenxuji-v${{ steps.ver.outputs.version }}-$T.apk"
          # 🔴 再存一份**固定文件名**，专供 App 内「检查更新」使用。
          #    version.json 里 update_url 若写成版本号文件名，每次发版都得手改配置；
          #    固定名 + GitHub Release 的 releases/latest/download/<name> 组合，
          #    就是一个**永久稳定、自动指向最新版**的下载地址：
          #      https://github.com/<owner>/<repo>/releases/latest/download/zhenxuji-latest.apk
          #    只对 release 包做，debug 包签名随机、覆盖安装会丢本地数据，不该被自动更新拉过去。
          if [ "$T" = "release" ]; then cp "$SRC" "dist/zhenxuji-latest.apk"; fi
          ls -lh dist
          # 🔴 断言产物名确实是 ASCII，且没被工具链吞成 "-v0.6.x-…"（见上方注释）
          for f in dist/*.apk; do
            case "$(basename "$f")" in
              -*) echo "::error::产物名以连字符开头，中文被工具链吞掉了：$f"; exit 1 ;;
            esac
            printf '%s' "$(basename "$f")" | LC_ALL=C grep -q '[^ -~]' && {
              echo "::error::产物名含非 ASCII 字符，跨平台不可靠：$f"; exit 1; }
          done
          echo "产物名均为 ASCII ✓"

      # 不变量：APK 内网页版本必须等于发布版本（防"包是旧的"）
      - name: Verify APK contents
        run: |
          V=${{ steps.ver.outputs.version }}
          unzip -p dist/*.apk assets/public/index.html | grep -o "window.APP_VERSION = '$V'" || { echo "::error::APK 内 APP_VERSION != $V"; exit 1; }
          echo "APK 内资产版本 = $V ✓"

      # 🔴 不变量：APK 指纹 + 签名证书锚点。
      #    文档 P2-3 要求每次构建输出 MD5/SHA256 并与历史基准对比。
      #    最该防的是「签名证书不一致」—— 一旦用了错 keystore，
      #    已装旧包会因证书不同**无法覆盖安装**，且用户无感知。
      #    故以「签名证书 SHA-256」为硬锚点（入库基线 signing.lock），
      #    MD5/SHA256 仅作为构建日志输出供人工追溯。
      #    证书指纹**只认 apksigner**（已在 Android SDK 里，CI 必有）；
      #    早期试过 unzip+META-INF/*.RSA+openssl 路线，但 v2/v3 签名块里
      #    证书文件名无法用 glob 稳定取到 → openssl 路线放弃，apksigner 是权威源。
      - name: Verify APK fingerprint & signing cert
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set +e
          APK=$(ls dist/*.apk | head -1)
          echo "=== APK 指纹 ==="
          md5sum "$APK" | sed 's/^/  MD5:   /'
          sha256sum "$APK" | sed 's/^/  SHA256: /'
          # 🔴 证书指纹从 keystore 取（keytool 输出稳定，不依赖 apksigner 的 stderr/stdout 行为）。
          #    实测根因：apksigner verify 把「Signer #1 certificate SHA-256 digest」写到 stderr，
          #    而原步骤 `2>/dev/null` 把它丢掉 → RAW 永远为空 → 误报「APK 未签名」。
          #    keystore 在 release 构建时由前序步骤从 secret 还原到 android/ 下，
          #    其证书 SHA-256 即 APK 的签名证书（build.gradle 用它签名），等价且更稳。
          if [ "$BUILD_TYPE" = "release" ]; then
            RAW=$(keytool -list -v -keystore android/zhenxuji-release.keystore \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
              | grep -iE "SHA256:" | head -1 \
              | grep -oiE '[0-9a-fA-F]{2}(:[0-9a-fA-F]{2}){31}' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -1)
            if [ -z "$RAW" ]; then
              echo "::error title=no-cert-fingerprint::未能从 keystore 提取签名证书指纹（keystore 还原失败？）"; exit 1
            fi
            CERT_FP=$(echo "$RAW" | sed 's/.\{2\}/&:/g; s/:$//')
            echo "证书 SHA-256: ${CERT_FP}"
            # signing.lock 含注释行，只取其中 64 位 hex 基线（忽略注释）
            BASE=$(grep -oE '[0-9a-f]{64}' android/signing.lock 2>/dev/null | head -1)
            if [ -z "$BASE" ]; then
              echo "::warning title=no-signing-baseline::android/signing.lock 不存在，跳过证书比对（首次请写入基线）"
            elif [ "$RAW" != "$BASE" ]; then
              echo "::error title=signing-cert-mismatch::签名证书指纹与基线不一致！"
              echo "::error::  基线 ：$BASE"
              echo "::error::  当前 ：$CERT_FP"
              echo "::error::用了错误的 keystore —— 已装旧包将无法覆盖安装。请核对 KEYSTORE_B64 / KEYSTORE_PASSWORD / KEY_ALIAS。"
              exit 1
            else
              echo "签名证书与基线一致 ✓"
            fi
          else
            echo "debug 包（随机签名），跳过证书基线比对"
          fi
          set -e

      # 🔴 不变量：tag 名必须与包内版本一致。
      #    2026-10-03 实测踩坑：index.html 还是 0.6.2 时打了 v0.6.3 的 tag，
      #    CI **照样全绿**，Release 里出现「v0.6.3 的标题 + 0.6.2 的包」，
      #    甚至 Release 正文自动写「对比 v0.6.2」——自相矛盾。
      #    根因：所有版本闸门校验的都是「tag/包内部一致」，唯独没人校验
      #    「tag 与 index.html 一致」，而 CI 又是被 tag 触发的 ——
      #    等于整个链条自己证明自己。此处补上这唯一的外部锚点。
      - name: Verify tag matches in-package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=${{ steps.ver.outputs.version }}
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$TAG" != "$V" ]; then
            echo "::error title=tag-version-mismatch::tag 是 v$TAG，但包内版本是 $V"
            echo "::error::请先把 index.html 的 APP_VERSION 与 version.json 同步升到 $TAG，再打 tag。"
            exit 1
          fi
          echo "tag 与包内版本一致：v$TAG ✓"

      - uses: actions/upload-artifact@v4
        with:
          name: zhenxuji-v${{ steps.ver.outputs.version }}-${{ env.BUILD_TYPE }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # 中文品牌名放在 Release 标题（UTF-8，展示层可靠），不放进文件名
          name: 帧叙集 v${{ steps.ver.outputs.version }}
          files: dist/*.apk
          generate_release_notes: true
